name: metronome
description: "Metronome app"
homepage: "https://github.com/MateusNavarro77/metronome"
repository: "https://github.com/MateusNavarro77/metronome"
screenshots:
  - path: "./readme-assets/app-screenshots/light.png"
    description: "Light theme"
  - path: "./readme-assets/app-screenshots/dark.png"
    description: "Dark theme"
publish_to: 'none' 
version: 1.3.0-alpha.2
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^2.0.0
  provider: ^6.1.5+1
  google_fonts: ^9.0.0
  flutter_soloud: ^5.2.3
  shared_preferences: ^2.3.2
  material_ui: ^1.11.0
  material_3_expressive: ^1.2.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  checks: ^0.3.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  default-flavor: dev
  uses-material-design: true
  assets:
    - assets/google_fonts/
    - assets/sounds/